<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旧告警台 · 待修复</title><style>body{font:14px sans-serif;margin:25px;background:#eef0f3}input,select,button{font:inherit;padding:8px}main{display:flex;gap:20px}#list{width:48%;height:550px;overflow:auto}#detail{width:48%;background:white;padding:20px}article{padding:12px;background:white;border-bottom:1px solid #ccc;cursor:pointer}.ok{color:green}h1{font-size:24px}</style><h1>旧告警台 · 当前 10,000 条</h1><p>这是可运行的故障起点。任务要求见 PROMPT.md。</p><input id="q" aria-label="搜索" placeholder="搜索"><select id="sev" aria-label="级别"><option value="">全部</option><option>P1</option><option>P2</option><option>P3</option></select><button id="confirm">确认选中行</button><p id="status">状态：就绪</p><main><div id="list"></div><div id="detail">选中事件后查看</div></main><script type="application/json" id="fixture">__FIXTURE__</script><script>
const all=JSON.parse(document.getElementById('fixture').textContent).events;let rows=all.slice(0,80),selected=0,confirmed=[];
function render(){const pattern=new RegExp(document.getElementById('q').value,'i');rows=all.slice(0,80).filter(e=>pattern.test(e.title)&&(!document.getElementById('sev').value||e.severity===document.getElementById('sev').value));document.getElementById('list').innerHTML=rows.map((e,i)=>`<article data-index="${i}">${e.severity} ${e.title}<br><small>${e.id} ${e.service}</small> ${confirmed[i]?'<span class="ok">已确认</span>':''}</article>`).join('');show()}
function show(){const e=rows[selected];document.getElementById('detail').innerHTML=e?`<h2>${e.title}</h2><p>${e.id}</p><p>${e.detail}</p><p>因果：可能是上游问题</p>`:'未找到';}
document.getElementById('q').oninput=render;document.getElementById('sev').onchange=render;document.getElementById('list').onclick=e=>{const a=e.target.closest('article');if(a){selected=Number(a.dataset.index);show()}};document.getElementById('confirm').onclick=()=>{confirmed[selected]=true;document.getElementById('status').textContent='已保存';render()};render();
</script></html>
