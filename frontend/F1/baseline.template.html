e;scrollbar-color:#586966 var(--bg)}#rows{position:relative}.row{position:absolute;left:0;right:0;height:88px;width:100%;padding:14px 20px;border:0;border-bottom:1px solid #2a3b3f;border-radius:0;text-align:left;background:transparent;display:grid;grid-template-columns:44px 1fr;gap:0 12px;align-content:center}.row[aria-selected=true]{background:#263832;border-left:3px solid var(--amber);padding-left:17px}.row:hover{background:#223237}.sev{grid-row:span 2;align-self:start;font:11px "SFMono-Regular",monospace;padding:4px 7px;border:1px solid currentColor;display:inline-block}.P1{color:var(--red)}.P2{color:var(--amber)}.P3{color:var(--green)}.row-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:10px;margin-top:8px;font-family:"SFMono-Regular",monospace}.acked{color:var(--green)}.detail{padding:24px}.detail h2{font-size:23px;font-weight:500;line-height:1.5;margin:12px 0 20px}.pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{font-size:11px;border:1px solid var(--line);padding:4px 7px;color:var(--muted)}dl{display:grid;grid-template-columns:90px 1fr;gap:12px;margin:25px 0;font-size:12px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.evidence{background:#0c1518;border-left:2px solid var(--amber);padding:15px;font-size:12px;line-height:1.8;max-height:200px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.primary{background:var(--amber);color:#152022;border-color:var(--amber);font-weight:600}.side{padding:22px}.side h3{font-weight:500;font-size:15px;margin-top:0}.chain{padding:0;list-style:none;margin:22px 0}.chain li{border-left:1px solid #536a62;padding:0 0 19px 16px;margin-left:5px}.chain button{padding:0;border:none;background:none;text-align:left;line-height:1.6;font-size:12px}.chain button:before{content:'●';color:var(--amber);position:relative;margin-left:-22px;margin-right:10px}.chain .small{font:10px "SFMono-Regular",monospace;color:var(--muted);padding-left:1px}.note{font-size:11px;line-height:1.8;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}.status{padding:13px 30px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:15px}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1050px){.workspace{grid-template-columns:1fr 1fr}.causal{grid-column:1/-1;border-top:1px solid var(--line)}.chain{display:flex;flex-wrap:wrap;gap:15px}.chain li{max-width:220px}}@media(max-width:650px){header{padding:20px;align-items:start}h1{font-size:24px}.identity{display:none}.stats{grid-template-columns:1fr 1fr}.stat{padding:15px 20px;border-bottom:1px solid var(--line)}.stat strong{font-size:26px}.filters{padding:16px 20px;gap:9px}.filters label{flex:1;min-width:100px}.filters label:first-child{flex-basis:100%}.workspace{display:block}.colhead{padding:18px 20px}#viewport{height:356px}.detail{padding:20px}.column{border-right:0}.status{padding:15px 20px;display:block}.status span{display:block;margin:4px 0}.chain{display:block}.chain li{max-width:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<header><div><div class="overline">NIGHT WATCH / INCIDENT 042</div><h1>凌晨事故控制台</h1><span class="muted">把噪声留在列表，把证据放到眼前。</span></div><div class="identity"><div class="live">● 固定回放 · 无生产连接</div><div class="muted">2026.09.26 / 03:14:00</div><div class="count">10,000 EVENTS · SYNTHETIC</div></div></header>
<div class="stats"><div class="stat"><strong id="total">10,000</strong><span>当前筛选事件</span></div><div class="stat"><strong id="critical" style="color:var(--red)">—</strong><span>P1 / 需要立即关注</span></div><div class="stat"><strong id="services">—</strong><span>涉及服务</span></div><div class="stat"><strong id="ackCount" style="color:var(--green)">—</strong><span>已确认事件</span></div></div>
<form class="filters" id="filters" role="search"><label>搜索 / 快捷键 /<input id="query" name="q" type="search" placeholder="事件、服务、Trace ID…" aria-label="搜索事件"></label><label>严重程度<select id="severity" aria-label="严重程度"><option value="">全部级别</option><option>P1</option><option>P2</option><option>P3</option></select></label><label>服务<select id="service" aria-label="服务"><option value="">全部服务</option></select></label><label>确认状态<select id="ackFilter" aria-label="确认状态"><option value="">全部状态</option><option value="open">待确认</option><option value="ack">已确认</option></select></label><button type="button" id="reset">清除筛选</button></form>
<main class="workspace"><section class="column"><div class="colhead"><h2>事件流</h2><span class="count" id="shown">按回放序号排序</span></div><div id="viewport" role="listbox" tabindex="0" aria-label="事件列表，使用上下方向键选择"><div id="rows"></div></div></section><section class="column"><div class="colhead"><h2>事件详情</h2><span class="count" id="selectedId"></span></div><div id="detail" class="detail"></div></section><aside class="column causal"><div class="colhead"><h2>因果证据</h2><span class="count">TRACE</span></div><div class="side" id="causal"></div></aside></main><footer class="status"><span id="status" role="status" aria-live="polite">正在载入固定回放…</span><span>↑ ↓ 选择 · Home / End 跳转 · / 搜索 · Esc 清空搜索</span></footer>
<script id="fixture" type="application/json">__FIXTURE__</script><script>
'use strict';
const fixture=JSON.parse(document.getElementById('fixture').textContent), data=fixture.events, byId=new Map(data.map(x=>[x.id,x]));
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ACK_PREFIX='nw-ack-event-v2:';let ack=new Set(),storageOK=true;
function loadAck(){const next=new Set(JSON.parse(localStorage.getItem('nw-ack-v1')||'[]').filter(x=>byId.has(x)));for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key?.startsWith(ACK_PREFIX)){const id=key.slice(ACK_PREFIX.length);if(byId.has(id)){if(localStorage.getItem(key)==='1')next.add(id);else next.delete(id)}}}return next}
try{ack=loadAck()}catch(e){storageOK=false}
const state={q:'',severity:'',service:'',ack:'',id:data[0].id};let filtered=[],tick=0;const ROW=88, OVERSCAN=3;
for(const service of [...new Set(data.map(e=>e.service))].sort())$('service').add(new Option(service,service));
function readURL(){const p=new URLSearchParams(location.search);state.q=p.get('q')||'';state.severity=['P1','P2','P3'].includes(p.get('severity'))?p.get('severity'):'';state.service=[...$('service').options].some(x=>x.value===p.get('service'))?p.get('service'):'';state.ack=['open','ack'].includes(p.get('ack'))?p.get('ack'):'';state.id=byId.has(p.get('id'))?p.get('id'):data[0].id;syncInputs();apply(false)}
function syncInputs(){$('query').value=state.q;$('severity').value=state.severity;$('service').value=state.service;$('ackFilter').value=state.ack}
function writeURL(push=false){const u=new URL(location.href);u.search='';for(const[k,v]of Object.entries(state))if(v)u.searchParams.set(k,v);history[push?'pushState':'replaceState']({},'',u)}
function apply(update=true){const q=state.q.trim().toLowerCase();filtered=data.filter(e=>(!state.severity||e.severity===state.severity)&&(!state.service||e.service===state.service)&&(!state.ack||(state.ack==='ack')===ack.has(e.id))&&(!q||[e.id,e.service,e.title,e.trace,e.detail].join(' ').toLowerCase().includes(q)));$('total').textContent=filtered.length.toLocaleString();$('critical').textContent=filtered.filter(e=>e.severity==='P1').length.toLocaleString();$('services').textContent=new Set(filtered.map(e=>e.service)).size;$('ackCount').textContent=filtered.filter(e=>ack.has(e.id)).length.toLocaleString();if(filtered.length&&!filtered.some(e=>e.id===state.id))state.id=filtered[0].id;$('viewport').scrollTop=0;renderRows();renderDetail();if(update)writeURL();$('status').textContent=`已匹配 ${filtered.length.toLocaleString()} / 10,000 条。${storageOK?'确认状态保存在本机。':'本机存储不可用，当前修改仅在内存中。'}`}
function renderRows(){const view=$('viewport'),height=view.clientHeight,start=Math.max(0,Math.floor(view.scrollTop/ROW)-OVERSCAN),end=Math.min(filtered.length,Math.ceil((view.scrollTop+height)/ROW)+OVERSCAN);$('rows').style.height=filtered.length?`${filtered.length*ROW}px`:'160px';$('rows').innerHTML=filtered.length?filtered.slice(start,end).map((e,j)=>`<button type="button" id="row-${e.id}" role="option" tabindex="-1" aria-label="${esc(e.id+' '+e.title)}" aria-selected="${e.id===state.id}" aria-posinset="${start+j+1}" aria-setsize="${filtered.length}" data-id="${e.id}" class="row" style="top:${(start+j)*ROW}px"><span class="sev ${e.severity}">${e.severity}</span><span class="row-title">${esc(e.title)}</span><span class="meta"><span>${e.time}</span><span>${e.service}</span>${ack.has(e.id)?'<span class="acked">已确认</span>':''}</span></button>`).join(''):'<div class="empty">没有匹配事件。<br>可以清除筛选后重新查找。</div>';const active=document.getElementById('row-'+state.id);if(active)$('viewport').setAttribute('aria-activedescendant',active.id);else $('viewport').removeAttribute('aria-activedescendant');$('shown').textContent=`${filtered.length.toLocaleString()} 条 / DOM ${end-start}`}
function renderDetail(){if(!filtered.length){$('detail').innerHTML='<div class="empty">当前筛选为空</div>';$('causal').innerHTML='<div class="muted">选择事件后显示证据链。</div>';$('selectedId').textContent='';return}const e=byId.get(state.id);$('selectedId').textContent=e.id;$('detail').innerHTML=`<div class="pills"><span class="sev ${e.severity}">${e.severity}</span><span class="pill">${e.service}</span><span class="pill">${ack.has(e.id)?'已确认':'待确认'}</span></div><h2>${esc(e.title)}</h2><dl><dt>首次观测</dt><dd>2026-09-26 ${e.time}</dd><dt>关联 Trace</dt><dd>${e.trace}</dd><dt>证据类型</dt><dd>${e.source} / 已知注入关系</dd></dl><div class="evidence">${esc(e.detail)}</div><div class="actions"><button class="primary" id="toggleAck">${ack.has(e.id)?'撤销确认':'确认此事件'}</button><button id="traceFilter">只看同一 Trace</button><button id="copyLink">复制当前链接</button></div>`;$('toggleAck').onclick=()=>{if(ack.has(e.id))ack.delete(e.id);else ack.add(e.id);try{localStorage.setItem(ACK_PREFIX+e.id,ack.has(e.id)?'1':'0');storageOK=true}catch(err){storageOK=false}apply()};$('traceFilter').onclick=()=>{Object.assign(state,{q:e.trace,severity:'',service:'',ack:''});syncInputs();apply()};$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('status').textContent='当前筛选和事件链接已复制。'}catch(err){$('status').textContent='自动复制不可用，请从地址栏复制当前链接。'}};
const ancestors=[];let cur=e;const seen=new Set();while(cur&&!seen.has(cur.id)){ancestors.unshift(cur);seen.add(cur.id);cur=byId.get(cur.parent)}const children=data.filter(x=>x.parent===e.id);$('causal').innerHTML=`<h3>${e.trace}</h3><p class="muted" style="font-size:12px;line-height:1.8">箭头方向：上游触发 → 当前事件 → 直接下游。</p><ol class="chain">${ancestors.map(x=>`<li><button data-jump="${x.id}" aria-label="查看 ${x.id} 因果事件">${esc(x.title)}</button><div class="small">${x.id} · ${x.service}${x.id===e.id?' · 当前':''}</div></li>`).join('')}${children.map(x=>`<li><button data-jump="${x.id}" aria-label="查看 ${x.id} 因果事件">↓ ${esc(x.title)}</button><div class="small">${x.id} · 直接下游</div></li>`).join('')}</ol><p class="note">这条关系来自预设故障注入记录。它说明本次合成事故的触发路径；不依据日志时间相邻推断真实世界因果。</p>`}
function select(id,reveal=false){state.id=id;writeURL(true);if(reveal){const i=filtered.findIndex(e=>e.id===id);if(i>=0){const v=$('viewport');if(i*ROW<v.scrollTop)v.scrollTop=i*ROW;else if((i+1)*ROW>v.scrollTop+v.clientHeight)v.scrollTop=(i+1)*ROW-v.clientHeight}}renderRows();renderDetail()}
$('rows').onclick=e=>{const row=e.target.closest('[data-id]');if(row){select(row.dataset.id);$('viewport').focus({preventScroll:true})}};
$('causal').onclick=e=>{const b=e.target.closest('[data-jump]');if(!b)return;const target=b.dataset.jump;if(!filtered.some(x=>x.id===target)){Object.assign(state,{q:'',severity:'',service:'',ack:''});syncInputs();apply(false)}select(target,true)};
$('viewport').onscroll=()=>{cancelAnimationFrame(tick);tick=requestAnimationFrame(renderRows)};
$('viewport').onkeydown=e=>{if(!['ArrowDown','ArrowUp','Home','End'].includes(e.key)||!filtered.length)return;e.preventDefault();let i=filtered.findIndex(x=>x.id===state.id);i=e.key==='Home'?0:e.key==='End'?filtered.length-1:Math.max(0,Math.min(filtered.length-1,i+(e.key==='ArrowDown'?1:-1)));select(filtered[i].id,true)};
$('filters').onsubmit=e=>e.preventDefault();$('query').oninput=()=>{state.q=$('query').value;apply()};for(const[id,key]of[['severity','severity'],['service','service'],['ackFilter','ack']])$(id).onchange=()=>{state[key]=$(id).value;apply()};$('reset').onclick=()=>{Object.assign(state,{q:'',severity:'',service:'',ack:''});syncInputs();apply()};document.onkeydown=e=>{const editing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);if(e.key==='/'&&!editing){e.preventDefault();$('query').focus()}if(e.key==='Escape'&&document.activeElement===$('query')){state.q='';syncInputs();apply();$('viewport').focus()}};window.onpopstate=readURL;window.onresize=renderRows;window.addEventListener('storage',e=>{if(e.key===null||e.key==='nw-ack-v1'||e.key?.startsWith(ACK_PREFIX)){try{ack=loadAck();apply(false)}catch(err){$('status').textContent='其他窗口存储格式无效；保留当前状态。'}}});
window.BENCHMARK={fixture:fixture.fixture,total:data.length,state:()=>({...state}),visibleIds:()=>filtered.map(e=>e.id),acknowledged:()=>[...ack],renderedCount:()=>document.querySelectorAll('.row').length};readURL();
</script></html>
