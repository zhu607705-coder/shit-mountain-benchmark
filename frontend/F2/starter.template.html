<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旧实验看板 · 待修复</title><style>body{font:14px sans-serif;margin:25px;background:#f1f3ed}button,input{font:inherit;padding:8px}table{border-collapse:collapse;background:white}td,th{padding:10px;border:1px solid #ccc}input{width:110px}#status{color:green}</style><h1>旧实验看板</h1><p>这是可运行的故障起点。任务要求见 PROMPT.md。</p><button id="net">切换网络</button><button id="undo">撤销</button><button id="save">保存</button><button id="remote">远端同步</button><p id="status">在线 · 已保存</p><table><thead><tr><th>编号</th><th>任务</th><th>开始分钟</th><th>持续分钟</th><th>依赖</th></tr></thead><tbody id="rows"></tbody></table><script id="fixture" type="application/json">__FIXTURE__</script><script>
const source=JSON.parse(document.getElementById('fixture').textContent);let tasks=source.tasks,last=tasks,online=true;
function render(){document.getElementById('rows').innerHTML=tasks.map((t,i)=>`<tr><td>${t.id}</td><td>${t.title}</td><td><input aria-label="${t.id} 开始" data-i="${i}" data-field="start" value="${t.start}"></td><td><input aria-label="${t.id} 时长" data-i="${i}" data-field="duration" value="${t.duration}"></td><td>${t.deps}</td></tr>`).join('')}
document.getElementById('rows').onchange=e=>{last=tasks;tasks[Number(e.target.dataset.i)][e.target.dataset.field]=Number(e.target.value);document.getElementById('status').textContent='已保存'};document.getElementById('undo').onclick=()=>{tasks=last;render()};document.getElementById('net').onclick=()=>{online=!online;document.getElementById('status').textContent=online?'在线':'离线'};document.getElementById('save').onclick=()=>{document.getElementById('status').textContent='已保存'};document.getElementById('remote').onclick=()=>{tasks=JSON.parse(document.getElementById('fixture').textContent).tasks;Object.assign(tasks.find(t=>t.id===source.remotePatch.id),source.remotePatch.changes);render();document.getElementById('status').textContent='同步完成'};render();
</script></html>
