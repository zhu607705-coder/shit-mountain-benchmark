<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bug Arena · 公开轨迹检查</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#dce6ef;background:#0d151d;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:clamp(18px,4vw,56px);max-width:1280px;margin:auto}header{border-bottom:1px solid #344653;padding-bottom:24px}.eyebrow{font:12px ui-monospace,monospace;color:#80cfc5;letter-spacing:.14em}h1{font-size:clamp(24px,4vw,42px);font-weight:650;margin:16px 0}p{line-height:1.7;color:#adbfcc;max-width:850px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:28px 0}button,.file{border:1px solid #5a7e8f;background:#173242;color:#e8faff;padding:11px 16px;border-radius:4px;font:inherit;cursor:pointer}button:focus-visible,.file:focus-within{outline:3px solid #79e3ce;outline-offset:4px}input{max-width:100%;font:inherit}.status{padding:14px 18px;background:#16232e;border-left:3px solid #81d2c5;min-height:50px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:24px 0}.stat{border-top:1px solid #526674;padding-top:16px}.stat strong{font:clamp(21px,3vw,38px) ui-monospace,monospace;display:block}.stat span{color:#adbfcc;font-size:13px}table{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed}th,td{text-align:left;border-bottom:1px solid #344653;padding:12px 8px;overflow-wrap:anywhere}th{color:#94baad;font-weight:500}th:first-child{width:34%}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;background:#131f29;max-height:360px;overflow:auto;font-size:12px}details{margin-top:24px}footer{font-size:13px;color:#91a6b6;margin-top:32px;padding-top:20px;border-top:1px solid #344653}@media(max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{align-items:stretch;flex-direction:column}button{text-align:left}}
</style>
<header><div class="eyebrow">TRACE / INPUT ONLY</div><h1>轨迹查看器</h1><p>仅查看输入，未执行评分。</p></header>
<div class="controls"><button id="sample" type="button">读取样本</button><label class="file">导入轨迹 <input id="file" type="file" accept=".jsonl,.gz"></label><button id="cancel" disabled type="button">停止读取</button></div>
<div id="status" class="status" role="status" aria-live="polite">请选择轨迹文件或读取样本。</div>
<section class="stats" aria-label="轨迹统计"><div class="stat"><strong id="commands">0</strong><span>命令</span></div><div class="stat"><strong id="rows">0</strong><span>记录</span></div><div class="stat"><strong id="events">0</strong><span>事件</span></div><div class="stat"><strong id="actors">0</strong><span>窗口</span></div></section>
<table aria-label="操作类型统计"><thead><tr><th>操作</th><th>次数</th><th>作用</th></tr></thead><tbody id="types"></tbody></table>
<details><summary>查看前 8 个命令摘要</summary><pre id="examples">尚无输入。</pre></details>
<details><summary>查看范围与说明</summary><p>支持 JSONL 和 JSONL.gz，按流读取输入并统计记录、事件和操作类型。此工具不执行参赛答案或评分。语义、浏览器性能、可访问性与人工视觉应分别验收；数据量不等同于思考难度。</p></details>
<script>
'use strict';
const $=id=>document.getElementById(id);let controller=null;
const meaning={config:'公开协议与窗口配置',load:'初始数据追加',ingest:'乱序事件或删除事实',deliver:'向一个副本递送因果事件',observe:'读取可观察语义',export:'实际全量导出',alias:'权威身份映射',ack:'带观察集的确认/撤销',view:'选择、焦点与链接状态',history:'前进或后退',stream:'局部服务状态',pause:'窗口快照切换',compact:'压缩与回放屏障',undo:'条件补偿撤销',storage:'持久化故障注入',refresh:'恢复持久化状态',restore_document:'旧版本恢复副本迁移'};
async function inspect(stream,label){if(controller)controller.abort();controller=new AbortController();const own=controller;let lines=0,rows=0,events=0,bytes=0,buffer='',counts={},actors=new Set(),examples=[];const reader=stream.pipeThrough(new TextDecoderStream()).getReader();$('cancel').disabled=false;$('sample').disabled=true;
function render(){for(const [id,value] of Object.entries({commands:lines,rows,events,actors:actors.size}))$(id).textContent=value.toLocaleString();$('types').replaceChildren();for(const [op,count] of Object.entries(counts)){const tr=document.createElement('tr');for(const text of [op,count.toLocaleString(),meaning[op]||'扩展操作']){const td=document.createElement('td');td.textContent=text;tr.append(td)}$('types').append(tr)}$('examples').textContent=examples.join('\n\n');}
function consume(line){if(!line.trim())return;const c=JSON.parse(line);if(typeof c.op!=='string')throw Error('命令缺少op');lines++;counts[c.op]=(counts[c.op]||0)+1;if(c.actor)actors.add(c.actor);if(c.op==='load')rows+=c.rows.length;if(c.op==='ingest')events+=c.rows.length;if(c.op==='deliver')events+=c.events.length;if(examples.length<8){const example={...c};if(c.rows)example.rows={count:c.rows.length,first:c.rows[0]};if(c.events)example.events={count:c.events.length,first:c.events[0]};examples.push(JSON.stringify(example,null,2))}}
try{while(true){if(own.signal.aborted){await reader.cancel();$('status').textContent='已停止；以上是实际读取的部分统计。';break}const part=await reader.read();if(part.done){if(buffer.trim())consume(buffer);render();$('status').textContent=`${label} 已读完：${lines.toLocaleString()} 个命令，${rows.toLocaleString()} 条初始记录。未运行语义裁判。`;break}bytes+=part.value.length;buffer+=part.value;let i;while((i=buffer.indexOf('\n'))>=0){consume(buffer.slice(0,i));buffer=buffer.slice(i+1)}render();$('status').textContent=`正在读取 ${label}：${(bytes/1048576).toFixed(1)} MiB 解码文本`;await new Promise(requestAnimationFrame)}}catch(error){render();$('status').textContent=`读取失败：${error.message}。以上仅为有效前缀统计。`}finally{reader.releaseLock();if(controller===own){controller=null;$('cancel').disabled=true;$('sample').disabled=false}}}
$('file').addEventListener('change',()=>{const file=$('file').files[0];if(!file)return;let stream=file.stream();if(file.name.endsWith('.gz')){if(typeof DecompressionStream==='undefined'){$('status').textContent='当前浏览器不支持gzip流，请先用generate_fixture.py解压。';return}stream=stream.pipeThrough(new DecompressionStream('gzip'))}inspect(stream,file.name)});
$('sample').addEventListener('click',async()=>{try{const response=await fetch('./sample.jsonl');if(!response.ok)throw Error(`HTTP ${response.status}`);await inspect(response.body,'smoke样本')}catch(error){$('status').textContent=`无法加载样本：${error.message}。请使用本地HTTP服务器或选择文件。`}});
$('cancel').addEventListener('click',()=>controller?.abort());
</script></html>
