<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Signal Room · 事故工作台</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#192e37;background:#f5f6f4;font-size:14px;--ink:#192e37;--line:#d9dfdb;--accent:#155d50}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b17c20;outline-offset:3px}header{padding:24px 32px 19px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:22px;align-items:center;justify-content:space-between}h1{margin:6px 0;font-size:30px;letter-spacing:-1px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--accent)}.muted{color:#57676d}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,.control{border:1px solid #becbc6;background:#fff;border-radius:5px;padding:9px 13px;color:var(--ink)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;max-width:1600px;margin:0 auto;min-height:calc(100vh - 130px)}main{min-width:0;padding:22px 26px}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}.field.search{flex:1;min-width:140px}.field input{width:100%}.statusline{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin:14px 0}.table-head,.row{display:grid;grid-template-columns:78px minmax(0,1fr) 110px 105px;gap:12px;align-items:center;text-align:left}.table-head{height:36px;padding:0 14px;color:#52635e;font-size:11px;letter-spacing:1px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#viewport{height:570px;max-height:65vh;overflow:auto;position:relative;background:#fff;border-bottom:1px solid var(--line);contain:strict}#spacer{width:100%;position:relative}#rows{position:absolute;left:0;right:0;top:0}.row{height:54px;width:100%;padding:6px 14px;border:0;border-bottom:1px solid #edf0ed;border-radius:0;background:#fff;font-size:12px}.row:hover{background:#edf3ef}.row[aria-pressed=true]{background:#e5efea;box-shadow:inset 3px 0 var(--accent)}.row-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:11px;color:#59696e;margin-top:3px}.sev{font-family:ui-monospace,monospace;font-size:11px;white-space:nowrap}.sev-0{color:#9f3825}.sev-1{color:#91611b}.sev-2{color:#155d50}.sev-3{color:#516270}.pill{font-size:11px;color:#516270}.inspector{min-width:0;background:#edf1ed;border-left:1px solid var(--line);padding:28px 23px}.inspector h2{font-size:18px;line-height:1.4;overflow-wrap:anywhere}.inspector dl{margin-top:25px}.inspector dt{font-size:11px;color:#52635e;margin-top:20px}.inspector dd{margin:5px 0;font-size:14px;overflow-wrap:anywhere}.section-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#596b63}#empty{position:absolute;top:90px;width:100%;text-align:center;color:#55676a}.footnote{font-size:12px;line-height:1.7;margin-top:20px;max-width:65ch}#notice{min-height:18px;font-size:12px;color:#81510a}.number{font-variant-numeric:tabular-nums}.skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;background:white;padding:10px;z-index:9}footer{padding:18px 32px;border-top:1px solid var(--line);font-size:11px;color:#65766c} @media(max-width:800px){header{padding:20px;align-items:flex-start}h1{font-size:25px}.layout{grid-template-columns:1fr}main{padding:18px 16px}.inspector{border-left:0;border-top:1px solid var(--line);padding:20px}#viewport{height:420px;max-height:55vh}.table-head,.row{grid-template-columns:66px minmax(0,1fr) 78px;gap:6px}.hide-mobile{display:none}}@media(max-width:430px){header{display:block}.top-actions{margin-top:15px}.toolbar{gap:8px}.field.search{flex-basis:100%}.statusline{display:block;line-height:1.7}.table-head,.row{grid-template-columns:55px minmax(0,1fr) 60px}.row{padding:6px 9px}.control{max-width:100%}footer{padding:14px 16px}}
</style>
<a class="skip" href="#search">跳到筛选</a><header><div><div class="eyebrow">SIGNAL ROOM / LIVE OPERATIONS</div><h1>事故工作台</h1><div class="muted">在持续变化的记录里，保留明确的判断。</div></div><div class="top-actions"><button id="pause" aria-pressed="false">暂停更新</button><button id="export">导出筛选结果</button></div></header>
<div class="layout"><main><div class="toolbar"><label class="field search">搜索标题或服务<input id="search" class="control" type="search" placeholder="查找服务、事故标题…" autocomplete="off"></label><label class="field">严重程度<select id="severity" class="control"><option value="">全部级别</option><option value="0">P0 · 严重</option><option value="1">P1 · 高</option><option value="2">P2 · 中</option><option value="3">P3 · 低</option></select></label><label class="field">状态<select id="status" class="control"><option value="">全部状态</option><option value="open">待处理</option><option value="resolved">已解决</option></select></label></div><div class="statusline"><strong id="count" class="number" role="status"></strong><span class="muted">按更新时间降序 · 选中对象按 ID 保持</span></div><div id="notice" role="status" aria-live="polite"></div><div class="table-head"><span>优先级</span><span>事件 / 服务</span><span>状态</span><span class="hide-mobile">更新时间</span></div><div id="viewport" aria-label="事故记录" tabindex="0"><div id="spacer"><div id="rows"></div></div><div id="empty" hidden>没有匹配记录。修改筛选条件继续查看。</div></div><p class="footnote muted">实验基线包含 50,000 条记录。重复消息和迟到版本由记录版本号处理；暂停期间的消息在恢复时统一应用。</p></main><aside class="inspector" aria-label="事故详情"><div class="section-label">Selected incident</div><h2 id="detail-title">选择一条事故记录</h2><div id="detail-body" class="muted">详情始终绑定事故 ID，不跟随列表中的行号。</div></aside></div><footer>BUG ARENA / FRONTEND 03 · 本地演示数据，无外部服务</footer>
<script>
'use strict';
const $=id=>document.getElementById(id);const ROW=54;const records=new Map();const versions=new Map();let visible=[],selected=null,paused=false,queued=[],raf=0,query='',sev='',status='';
function storeURL(){const p=new URLSearchParams();if(query)p.set('q',query);if(sev)p.set('severity',sev);if(status)p.set('status',status);if(selected)p.set('selected',selected);history.replaceState(null,'',location.pathname+(p.size?'?'+p:''));}
function readURL(){const p=new URLSearchParams(location.search);query=p.get('q')||'';sev=p.get('severity')||'';status=p.get('status')||'';selected=p.get('selected');$('search').value=query;$('severity').value=sev;$('status').value=status;}
function save(){localStorage.setItem('arena-f1-view',JSON.stringify({query,sev,status,selected}));storeURL();}
function apply(batch){for(const e of batch){if(!e||typeof e.id!=='string'||!Number.isSafeInteger(e.rev)||e.rev<0)continue;versions.set(e.id,e.rev);if(e.deleted)records.delete(e.id);else records.set(e.id,{...e});}if(selected&&!records.has(selected)){$('notice').textContent='选中的记录已被删除。';selected=null;save();}schedule();}
function schedule(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;refresh();});}
function refresh(){const q=query.trim().toLocaleLowerCase();visible=[...records.values()].filter(r=>(!q||(r.title+' '+r.service).toLocaleLowerCase().includes(q))&&(!sev||String(r.severity)===sev)&&(!status||r.status===status)).sort((a,b)=>b.updated-a.updated||a.id.localeCompare(b.id));$('count').textContent=visible.length.toLocaleString('en-US')+' / '+records.size.toLocaleString('en-US')+' 条记录';$('spacer').style.height=(visible.length*ROW)+'px';$('empty').hidden=visible.length>0;renderRows();renderDetail();}
function txt(tag,text,cls){const n=document.createElement(tag);n.innerHTML=text;if(cls)n.className=cls;return n;}
function renderRows(){const el=$('viewport');const first=Math.max(0,Math.floor(el.scrollTop/ROW)-3),last=Math.min(visible.length,first+Math.ceil(el.clientHeight/ROW)+7);const frag=document.createDocumentFragment();const focus=document.activeElement?.dataset?.id;for(let i=first;i<last;i++){const r=visible[i],b=txt('button','','row');b.dataset.id=r.id;b.type='button';b.setAttribute('aria-pressed',String(selected===r.id));b.setAttribute('aria-label',r.id+' '+r.title);b.append(txt('span','P'+r.severity,'sev sev-'+r.severity));const title=document.createElement('div');title.style.minWidth='0';title.append(txt('div',r.title,'row-title'),txt('div',r.service+' · '+r.id,'row-sub'));b.append(title,txt('span',r.status==='open'?'待处理':'已解决','pill'),txt('span',new Date(r.updated).toISOString().slice(11,19),'hide-mobile number'));frag.append(b);}$('rows').style.transform=`translateY(${first*ROW}px)`;$('rows').replaceChildren(frag);if(focus){const f=[...$('rows').children].find(x=>x.dataset.id===focus);if(f)f.focus({preventScroll:true});}}
function renderDetail(){const r=records.get(selected);if(!r){$('detail-title').textContent='选择一条事故记录';$('detail-body').textContent='详情始终绑定事故 ID，不跟随列表中的行号。';return;}$('detail-title').textContent=r.title;const dl=document.createElement('dl');for(const [k,v] of [['记录 ID',r.id],['服务',r.service],['严重程度','P'+r.severity],['状态',r.status==='open'?'待处理':'已解决'],['记录版本',r.rev],['更新时间',new Date(r.updated).toISOString()]])dl.append(txt('dt',k),txt('dd',String(v)));$('detail-body').replaceChildren(dl);}
$('rows').onclick=e=>{const row=e.target.closest('[data-id]');if(row){selected=visible[Array.from(row.parentNode.children).indexOf(row)]?.id;save();renderRows();renderDetail();}};
$('viewport').onscroll=()=>requestAnimationFrame(renderRows);
$('viewport').onkeydown=e=>{if(!['ArrowDown','ArrowUp'].includes(e.key))return;e.preventDefault();let i=visible.findIndex(x=>x.id===selected);i=Math.max(0,Math.min(visible.length-1,i+(e.key==='ArrowDown'?1:-1)));if(!visible[i])return;selected=visible[i].id;$('viewport').scrollTop=Math.max(0,(i-3)*ROW);save();renderRows();renderDetail();const b=[...$('rows').children].find(x=>x.dataset.id===selected);b?.focus({preventScroll:true});};
for(const id of ['search','severity','status'])$(id).addEventListener(id==='search'?'input':'change',()=>{query=$('search').value;sev=$('severity').value;status=$('status').value;$('viewport').scrollTop=0;save();schedule();});
$('pause').onclick=()=>{paused=!paused;$('pause').setAttribute('aria-pressed',String(paused));$('pause').textContent=paused?'恢复更新':'暂停更新';if(!paused){const batch=queued;queued=[];apply(batch.slice(-50));$('notice').textContent='已应用暂停期间的 '+batch.length+' 条消息。';}};
function csvCell(v){let s=String(v);if(/^(?!)/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
$('export').onclick=()=>{const fields=['id','title','service','severity','status','rev'];const csv='\ufeff'+fields.join(',')+'\r\n'+visible.map(r=>fields.map(k=>csvCell(r[k])).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='incidents.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
window.bench={load(list){records.clear();versions.clear();queued=[];apply(list);},ingest(batch){if(paused){queued.push(...batch);$('notice').textContent='暂停中 · '+queued.length+' 条消息待应用';}else apply(batch);}};
window.addEventListener('popstate',()=>{readURL();schedule();});
if(!location.search){try{const v=JSON.parse(localStorage.getItem('arena-f1-view')||'null');if(v){query=v.query;sev=v.sev;status=v.status;selected=v.selected;storeURL();}}catch{}}
readURL();const data=Array.from({length:50000},(_,i)=>({id:'INC-'+String(i).padStart(5,'0'),rev:1,title:['上游请求超时','队列积压，需要检查消费者','缓存命中率变化','服务健康检查恢复'][i%4]+' / '+i,service:['gateway','queue','storage','billing','search'][i%5],severity:i%4,status:i%7===0?'resolved':'open',updated:1730000000000+i*1000}));apply(data);
</script></html>
